name: Android ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerekli SDK paketleri
        # GitHub-hosted runner'larda Android SDK hazır gelir; sdkmanager PATH'te olmayabilir.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager bulunamadı: $ANDROID_HOME" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Godot 4.7.2-stable (Linux)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          ln -sf "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Export şablonları
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -r "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"

      - name: CI için debug keystore (depoya eklenmez)
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/blockverse-debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BlockVerse Demo, OU=Demo, O=BlockVerse, L=Istanbul, S=Istanbul, C=TR"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/blockverse-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Godot import (global sınıf önbelleği)
        # Temiz checkout'ta .godot/ yok; class_name'ler bu taramadan sonra tanınır.
        run: godot --headless --path . --editor --quit

      - name: Doğrulama (GDScript)
        run: godot --headless --path . --scene res://tests/validate.tscn

      - name: Doğrulama (smoke test)
        run: timeout 180 godot --headless --path . --scene res://tests/smoke_test.tscn

      - name: ARM64 debug APK derle
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android ARM64 (Debug)" \
            "builds/BlockVerse-Ultimate-Demo.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: BlockVerse-Ultimate-Demo
          path: builds/BlockVerse-Ultimate-Demo.apk
          if-no-files-found: error
